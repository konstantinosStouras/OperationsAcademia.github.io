name: Inspect UCL 49655 publication
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund firebase-admin@12
      - name: Inspect only whitelisted UCL vacancy fields
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node --input-type=module <<'JS'
          import {firestore} from './_scraper/_mail.mjs';
          const db=await firestore(); if(!db) throw Error('No database');
          const keys=['id','institution','school','unit','type','levels','country','applyByDate','reviewDate','adUrl','postedAtUrl','furtherInfoUrl','applicationStatus','source'];
          const clean=r=>Object.fromEntries(keys.filter(k=>r&&k in r).map(k=>[k,r[k]]));
          const match=r=>[r?.adUrl,r?.postedAtUrl].some(u=>/jobId=(?:Q1KFK026203F3VBQBLO8M8M07-)?49655(?:&|$)/.test(u||''));
          for(const c of ['jobReviews','jobSubmissions']) {
            const s=await db.collection(c).get();
            for(const d of s.docs) {
              const v=d.data(); if(!match(v.row)&&!match(v)&&!match(v.edits)) continue;
              console.log(JSON.stringify({collection:c,id:d.id,status:v.status,reviewedAt:typeof v.reviewedAt==='string'?v.reviewedAt:undefined,row:clean(v.row||v),edits:clean(v.edits)}));
            }
          }
          JS
