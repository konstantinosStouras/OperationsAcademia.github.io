name: Scoped seven approval verification
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: oa-jobs-data-refs/heads/master
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/preserve-reviewed-comments
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund firebase-admin@12
      - name: Scoped public job fields only
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          cat > scoped-seven.mjs <<'JS'
          import {execFileSync} from 'node:child_process';
          execFileSync('node',['_scraper/review-comments-test.mjs'],{stdio:'inherit'});
          execFileSync('node',['_scraper/selftest.mjs','--publishing'],{stdio:'inherit'});
          JS
          node scoped-seven.mjs
