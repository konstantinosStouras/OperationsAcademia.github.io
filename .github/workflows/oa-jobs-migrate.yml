name: Check existing map-test baseline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Unchanged master school-location test
        run: node _scraper/school-location-test.mjs
