name: OA data — publish queued postings, candidates and placements

# Turns everything submitted through the site's own forms into rows in
# data/ and commits them: job postings (post-a-job) into jobs.json,
# candidate profiles (post-a-candidate) into candidates.json — held back
# until the reveal date in candidates-reveal.json — and confirmed placements
# (post-a-placement) into placements.json. This is what replaced Awesome
# Tables: the data lives in this repository, and the pages read it directly.
#
# ONE workflow for all three on purpose: they all write data/, so they
# must share the concurrency group below, and one runner + one commit beats
# three queued fires racing each other's push.
#
# It is a NO-OP until the FIREBASE_SERVICE_ACCOUNT secret is set, so it is safe
# to have running before the Firebase project exists.

on:
  # The instant path: a Cloud Function (v2/_functions) fires this the moment a
  # posting is created, edited, withdrawn or hidden, so the change is live in
  # about a minute. The schedule below is the safety net that catches anything
  # the doorbell missed.
  repository_dispatch:
    types: [oa-jobs-changed]
  # An approval publishes in TWO steps: the sheet read writes the approved rows
  # into data/jobmarket.json, and this build merges that file into the served
  # jobs.json. Chained here, so the second step does not wait for its own
  # schedule — that wait was up to twenty minutes on top of the half hour the
  # sheet read used to cost, and it is why an approved posting could take most
  # of an hour to appear. It runs on `completed` whatever the conclusion: this
  # build is idempotent and reads the file that is committed, so a sheet read
  # that failed after committing is still published, and one that wrote nothing
  # produces no commit here.
  workflow_run:
    workflows: ["OA jobs — read the job market tracking sheet"]
    types: [completed]
  schedule:
    # every 20 minutes, off the hour so this repo does not queue behind every
    # other :00 job on the runners
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would change, write nothing'
        type: boolean
        default: false

permissions:
  contents: write

# One writer of data/ at a time. Overlapping fires queue and coalesce rather
# than racing each other's commit — the same discipline as /lit/'s data jobs.
concurrency:
  group: oa-jobs-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # THE TIP OF THE BRANCH WE WILL PUSH TO, named explicitly — not the
          # default, which is `github.sha`. On a `workflow_run` event that is
          # the head of the run that TRIGGERED us, and the sheet read commits
          # before it finishes, so by the time this job starts that SHA is
          # already one commit behind. The build then rebuilt data/ from a
          # stale base and its push was rejected: two of the failures on
          # 2026-08-26 were exactly this, and both were on the workflow_run
          # path. Checking out what the Commit step below pushes to (the same
          # `github.ref_name`) makes that push a fast-forward.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Is Firebase configured?
        id: gate
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          # Until the project exists this job has nothing to do. Checking first
          # saves an npm install on every scheduled fire — ~100 no-op runs a day
          # while the site is still being set up.
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Firebase is not configured yet — nothing to do. See _SETUP-FIREBASE.md"
          fi

      - name: Install the Admin SDK
        if: steps.gate.outputs.ready == 'true'
        run: npm install --no-save --no-audit --no-fund firebase-admin@12 nodemailer@6

      - name: Offline checks
        run: node _scraper/selftest.mjs --publishing

      # THE WHOLE BUILD, IN ONE STEP, because the Commit step below has to be
      # able to run it AGAIN. data/ is generated, so a rejected push has
      # nothing to rebase — the recovery is to take the other writer's tip and
      # rebuild on it, and a workflow step cannot re-run the steps before it.
      # While "what a build is" lived in four YAML steps the retry could not
      # perform one. _scraper/build-all.mjs is now the single definition; it
      # keeps the per-step Firebase gate (the three Firestore builders are
      # skipped without the secret, the offline directory build always runs)
      # and prints a heading per builder so the log reads as it did.
      - name: Publish everything queued
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # The Drive credentials, for filing uploaded adverts and candidates'
          # CVs into the season's folders. Missing = the build still
          # publishes, just without the File links, and warns.
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          # For the before/after e-mail on every edit or takedown. Unset =
          # the message is printed into this log instead of sent.
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          node _scraper/build-all.mjs ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Re-check the file we are about to commit
        id: recheck
        run: node _scraper/selftest.mjs --publishing

      # A red re-check stops the commit, which is right — a broken dataset must
      # not ship. What it must not be is QUIET: nothing is published while it
      # stays red, on this run or any later one, and from the outside that is
      # indistinguishable from a site with no new postings. It cost most of a
      # day once, with the postings sitting in Firestore marked Live.
      - name: Say what a red re-check means
        if: failure() && steps.recheck.outcome == 'failure'
        run: |
          echo "::error title=Publishing has STOPPED::The dataset was rebuilt, but the \
          selftest failed on it, so nothing was committed — and nothing will publish \
          until it is green. The failures above name the guard. A guard that fires on a \
          legitimate NEW posting is the guard's bug, not the posting's."

      - name: Commit
        if: github.ref_name == 'master' && !inputs.dry_run
        env:
          # the SAME credentials the build step carries: a rejected push
          # REBUILDS on the new tip, and a rebuild reads Firestore
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          REF='${{ github.ref_name }}'

          if [ -z "$(git status --porcelain data)" ]; then
            echo "no change — nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data _functions
          git commit -m "OA data: publish queued submissions"

          # A REJECTED PUSH IS REBUILT, NEVER REBASED.
          #
          # Everything under data/ is a build OUTPUT. `git pull --rebase` used
          # to sit here, and it asked git to reconcile two independently
          # GENERATED copies of the same file: data/jobs-meta.json carries a
          # `generated` timestamp and row counts, so the same lines always
          # differ and the rebase conflicted BY CONSTRUCTION — the run then
          # died mid-rebase with git's own message (2026-08-26). Where it had
          # SUCCEEDED it would have been worse than failing: it would have
          # pushed a data/ snapshot built BEFORE the other writer's commit,
          # dropping their rows with nothing to show it had happened.
          #
          # So the recovery is the one that suits generated files: throw our
          # commit away, take their tip, and rebuild on top of it. The build
          # is idempotent and derives everything from Firestore plus the
          # committed files, so the result carries BOTH writers' work.
          for i in 1 2 3 4 5; do
            if git push origin HEAD:"$REF"; then
              echo "pushed"
              exit 0
            fi

            echo "push rejected — rebuilding on the new tip (attempt $i)"
            sleep $((i * 3))
            git fetch origin "$REF" || exit 1
            git reset --hard FETCH_HEAD || exit 1

            # OA_REBUILD: the first pass already mailed the "what changed"
            # diff; a second, slightly narrower copy from the retry is noise
            if ! OA_REBUILD=1 node _scraper/build-all.mjs; then
              echo "::error title=Publishing has STOPPED::the rebuild on the new \
              tip failed, so nothing was committed. The build's own errors are above."
              exit 1
            fi

            # THE SAME GATE THE FIRST PASS PASSED THROUGH. The commit before
            # the loop is only reached because the re-check step above was
            # green; a rebuilt dataset has not been checked yet, and a retry
            # that skipped it could commit exactly what that gate exists to
            # refuse.
            if ! node _scraper/selftest.mjs --publishing; then
              echo "::error title=Publishing has STOPPED::the dataset rebuilt on \
              the new tip failed the selftest, so nothing was committed — and \
              nothing will publish until it is green. A guard that fires on a \
              legitimate NEW posting is the guard's bug, not the posting's."
              exit 1
            fi

            if [ -z "$(git status --porcelain data)" ]; then
              # Not a failure, and the commonest outcome of a real race: the
              # writer that beat us had already published everything we had.
              echo "the other writer published it all — nothing left to commit"
              exit 0
            fi
            git add data _functions
            git commit -m "OA data: publish queued submissions"
          done

          echo "::error title=Publishing has STOPPED::could not push after 5 \
          attempts, so nothing was committed. Every attempt rebuilt cleanly on \
          the newest tip, so this is contention, not a broken dataset — the next \
          scheduled run republishes."
          exit 1
