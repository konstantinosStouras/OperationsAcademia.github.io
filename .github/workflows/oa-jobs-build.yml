name: OA data — publish queued postings, candidates and placements

# Turns everything submitted through the site's own forms into rows in
# data/ and commits them: job postings (post-a-job) into jobs.json,
# candidate profiles (post-a-candidate) into candidates.json — held back
# until the reveal date in candidates-reveal.json — and confirmed placements
# (post-a-placement) into placements.json. This is what replaced Awesome
# Tables: the data lives in this repository, and the pages read it directly.
#
# ONE workflow for all three on purpose: they all write data/, so they
# must share the concurrency group below, and one runner + one commit beats
# three queued fires racing each other's push.
#
# It is a NO-OP until the FIREBASE_SERVICE_ACCOUNT secret is set, so it is safe
# to have running before the Firebase project exists.

on:
  schedule:
    # every 20 minutes, off the hour so this repo does not queue behind every
    # other :00 job on the runners
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would change, write nothing'
        type: boolean
        default: false

permissions:
  contents: write

# One writer of data/ at a time. Overlapping fires queue and coalesce rather
# than racing each other's commit — the same discipline as /lit/'s data jobs.
concurrency:
  group: oa-jobs-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Is Firebase configured?
        id: gate
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          # Until the project exists this job has nothing to do. Checking first
          # saves an npm install on every scheduled fire — ~100 no-op runs a day
          # while the site is still being set up.
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Firebase is not configured yet — nothing to do. See _SETUP-FIREBASE.md"
          fi

      - name: Install the Admin SDK
        if: steps.gate.outputs.ready == 'true'
        run: npm install --no-save --no-audit --no-fund firebase-admin@12

      - name: Offline checks
        run: node _scraper/selftest.mjs

      - name: Publish queued postings
        if: steps.gate.outputs.ready == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # The Drive credentials, for filing uploaded adverts into the
          # season's "Jobs Files" folder. Missing = the build still publishes
          # postings, just without their File links, and warns.
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          node _scraper/build-jobs.mjs ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Publish candidate profiles
        if: steps.gate.outputs.ready == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # same Drive credentials: CVs and research summaries are filed into
          # the season's "Candidates Files" folder
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          node _scraper/build-candidates.mjs ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Publish confirmed placements
        if: steps.gate.outputs.ready == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node _scraper/build-placements.mjs ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Re-check the file we are about to commit
        run: node _scraper/selftest.mjs

      - name: Commit
        if: github.ref_name == 'master' && !inputs.dry_run
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "no change — nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "OA data: publish queued submissions"

          # plain fast-forward, with rebase-and-retry: a concurrent writer may
          # have moved the branch on while this run was working
          for i in 1 2 3 4 5; do
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "pushed"
              exit 0
            fi
            echo "push rejected — rebasing onto the new tip (attempt $i)"
            git pull --rebase origin ${{ github.ref_name }} || exit 1
            sleep $((i * 3))
          done
          echo "could not push after 5 attempts"
          exit 1
