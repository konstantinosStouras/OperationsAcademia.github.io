name: OA alerts — send what is due

# Sends every e-mail alert subscription that is due. Each alert carries its own
# high-water mark, advanced only when its own send succeeds, so one failure
# never swallows a window for anybody else.
#
# A no-op until FIREBASE_SERVICE_ACCOUNT is set.

on:
  # The instant path: run right after every publish that could have added the
  # postings a subscriber is waiting for, so an "as soon as something appears"
  # alert really means minutes rather than "by the top of the next hour".
  # Cheap by construction — each alert's high-water mark means a fire with
  # nothing new sends nothing — and gated below to SUCCESSFUL builds, since a
  # failed build committed no new postings. Daily/weekly/monthly subscriptions
  # are simply not due on most fires.
  workflow_run:
    workflows: ["OA data — publish queued postings, candidates and placements"]
    types: [completed]
  schedule:
    # hourly, off the hour — the safety net for anything the chain missed;
    # daily/weekly/monthly subscriptions are due here and nowhere sooner.
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Match and render, send nothing'
        type: boolean
        default: false
      scan:
        description: 'Only report which alerts are due'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: oa-alerts-mail-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mail:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A build that FAILED committed nothing, so there is nothing new to send —
    # and its checkout here would only re-read the same file the last run saw.
    # Scheduled and hand-dispatched fires are unaffected.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Is Firebase configured?
        id: gate
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          # Until the project exists this job has nothing to do. Checking first
          # saves an npm install on every scheduled fire — ~100 no-op runs a day
          # while the site is still being set up.
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Firebase is not configured yet — nothing to do. See _SETUP-FIREBASE.md"
          fi

      - run: npm install --no-save --no-audit --no-fund firebase-admin@12 nodemailer@6
        if: steps.gate.outputs.ready == 'true'

      - name: Offline checks
        run: node _scraper/alerts-mailer.mjs --selftest

      - name: Send
        if: steps.gate.outputs.ready == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: |
          node _scraper/alerts-mailer.mjs \
            ${{ inputs.scan && '--scan' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}
