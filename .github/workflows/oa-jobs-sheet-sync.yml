name: OA jobs — sync the Google Sheet (RETIRED)

# RETIRED on 2026-08-16. The Google Sheet is no longer a writer of this
# dataset: every posting was migrated into Firestore
# (_scraper/migrate-to-firestore.mjs) and the postings are now the database,
# so oa-jobs-build.yml generates data/jobs.json from documents that can be
# edited. Reading the sheet on a schedule would UNDO an edit — it rebuilds a
# row from the sheet, which knows nothing about the correction — which is the
# exact failure this retirement removes.
#
# It is kept, disabled, rather than deleted: it is the only description of how
# the sheet was read, and it is the way back if the migration has to be redone.
# The schedule is gone; it runs only when dispatched by hand, and then only in
# dry-run.
#
# THE OLD GOOGLE FORM MUST BE SWITCHED OFF. While it accepts responses they go
# into a sheet nothing reads any more, so a poster gets a confirmation and
# their posting never appears. Point it at /post-a-job.html.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would change, write nothing'
        type: boolean
        default: false

permissions:
  contents: write

# Shares the group with oa-jobs-build.yml: both write data/, so they must
# never race each other's commit. Overlapping fires queue and coalesce.
concurrency:
  group: oa-jobs-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Offline checks
        run: node _scraper/selftest.mjs --publishing

      # NO --min-year. The scope is derived by marketFloor() in jobs-model.mjs,
      # which owns the roll rule (1 July) and the MARKET_WINDOW width, and the
      # page heading is derived from the same rule — so the season rolls by
      # itself and there is nothing left to bump by hand.
      #
      # It was pinned to `--min-year 2026` to match a heading typed by hand,
      # and by August 2026 both were a season behind the market that had
      # already started. Pass --min-year only for a deliberate one-off.
      - name: Read the sheet and merge what is missing
        run: |
          node _scraper/import-sheet.mjs --sheet --merge \
               --out data/jobs.json --dry-run

      - name: Re-check the file we are about to commit
        run: node _scraper/selftest.mjs --publishing

      - name: Commit
        if: github.ref_name == 'master' && !inputs.dry_run
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "no change — nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "OA jobs: sync postings from the Google Sheet"

          # plain fast-forward, with rebase-and-retry — the posting pipeline may
          # have moved the branch on while this run was working
          for i in 1 2 3 4 5; do
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "pushed"
              exit 0
            fi
            echo "push rejected — rebasing onto the new tip (attempt $i)"
            git pull --rebase origin ${{ github.ref_name }} || exit 1
            # THE REBUILT TREE GOES THROUGH THE SAME GATE, exactly as the
            # build's own retry does. A rebase brings another writer's data/ in
            # under this run's commit, and the re-apply above then rewrites the
            # served files against it -- so what is about to be pushed is NOT
            # what the gate passed before the loop. Without this, a retry can
            # commit precisely what the gate exists to refuse, which is the
            # rule this repository already wrote down for oa-jobs-build.yml.
            if ! node _scraper/selftest.mjs --publishing; then
              echo "::error::the rebuilt data/ does not pass the publishing gate - pushing nothing"
              exit 1
            fi
            sleep $((i * 3))
          done
          echo "could not push after 5 attempts"
          exit 1
