name: OA — tell the maintainer somebody has posted something

# A job posting or a candidate profile made through the site's OWN forms went
# into Firestore, was published by the next build, and nothing said so. The
# tracking sheet's postings had a mailer; these did not. For candidates it was
# worse: their profiles are held behind the reveal date, so they reach no
# served file and draw no card anywhere on the site — there was no screen that
# could show them at all.
#
# This mails the maintainer about each one and stamps `announcedAt` on the
# document, so nothing is announced twice. It is NOT a gate: the posting is
# already live, or about to be, exactly as the form promises.
#
# Every 15 minutes, off the boundary and off the review mailer's minutes so the
# two never argue over the same SMTP connection. A run with nothing new costs
# two Firestore queries and sends nothing.
#
# A no-op until FIREBASE_SERVICE_ACCOUNT is set, and a no-op that SAYS SO until
# SMTP_* is set — the submissions simply stay unannounced and are mailed once
# it exists, because `announcedAt` is only stamped after a send succeeds.

on:
  # THE INSTANT PATH. The poster's half of this mailer says their posting is
  # "live on operationsacademia.org", and post-a-job.html now promises an
  # e-mail "as soon as it is publicly shown" — so it has to fire when the
  # posting is actually shown, which is the moment the build commits it.
  #
  # The schedule below cannot keep that promise on its own. It asks for 96
  # runs a day and GitHub, which throttles scheduled workflows on a busy
  # repository, delivers about five: measured over the last twelve fires the
  # mean gap was SIX HOURS and the worst was twelve. A promise the pipeline
  # misses by six hours is the copy-versus-cadence gap this repository already
  # records ("if the cadence ever changes, they change with it").
  #
  # Same shape and same reasoning as oa-alerts-mail.yml, which chains here for
  # exactly this reason. Cheap by construction: both passes key on their own
  # high-water mark (`announcedAt`, `liveMailedAt`), so a fire with nothing new
  # sends nothing, and the concurrency group below makes overlapping fires
  # queue rather than race.
  workflow_run:
    workflows: ["OA data — publish queued postings, candidates and placements"]
    types: [completed]
  schedule:
    # the safety net for anything the chain missed — and the only thing that
    # runs when the build has not
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Render the e-mails and print them, send nothing'
        type: boolean
        default: false
      scan:
        description: 'List what would be mailed and stop'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: oa-submissions-mail-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A build that FAILED committed nothing, so it published no posting and
    # there is nobody new to tell. Scheduled and hand-dispatched fires are
    # unaffected.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v5
        with:
          # THE TIP OF THE BRANCH, named explicitly — not the default, which is
          # `github.sha`. On a `workflow_run` event that is the head of the run
          # that TRIGGERED us, and the build commits data/jobs.json BEFORE it
          # finishes, so the default would read the commit before the postings
          # we were fired about. That is precisely the bug oa-alerts-mail.yml
          # shipped with, and it matters more here: "publicly shown" is decided
          # by whether the row is in this checkout's data/jobs.json, so a stale
          # read does not delay the poster's e-mail — it silently concludes
          # there is nobody to write to.
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Is Firebase configured?
        id: gate
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          # Until the project exists this job has nothing to do. Checking first
          # saves an npm install on every scheduled fire.
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Firebase is not configured yet — nothing to do. See _SETUP-FIREBASE.md"
          fi

      - run: npm install --no-save --no-audit --no-fund firebase-admin@12 nodemailer@6
        if: steps.gate.outputs.ready == 'true'

      # Runs even when the gate is closed: it needs neither credentials nor the
      # network, and it is the check that would catch a broken renderer before
      # the first real submission is ever made.
      - name: Offline checks
        run: node _scraper/submissions-mailer.mjs --selftest

      - name: Announce what has been posted
        if: steps.gate.outputs.ready == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # Where "somebody has posted something" goes. Defaults to
          # JOBREVIEW_ALERT_TO, then to CONTACT in _mail.mjs.
          SUBMISSION_ALERT_TO: ${{ vars.SUBMISSION_ALERT_TO }}
          JOBREVIEW_ALERT_TO: ${{ vars.JOBREVIEW_ALERT_TO }}
          SITE_URL: ${{ vars.SITE_URL }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          node _scraper/submissions-mailer.mjs \
            ${{ inputs.scan && '--scan' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}
