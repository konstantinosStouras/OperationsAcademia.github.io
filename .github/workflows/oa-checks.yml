name: OA v2 — checks

# The offline guard rails for the v2 rebuild. No network, no credentials, so
# this runs on every push and every pull request.

on:
  push:
    paths:
      - '*.html'
      - 'assets/**'
      - 'partials/**'
      - 'data/**'
      - '_scraper/**'
      - '_firestore.rules'
      - '_storage.rules'
      - 'v3/**'
      - '.github/workflows/oa-checks.yml'
  pull_request:
    paths:
      - '*.html'
      - 'assets/**'
      - 'partials/**'
      - 'data/**'
      - '_scraper/**'
      - '_firestore.rules'
      - '_storage.rules'
      - 'v3/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Every script parses
        run: |
          set -e
          for f in assets/oa-*.js; do node --check "$f"; done
          for f in _scraper/*.mjs; do node --check "$f"; done
          echo "all scripts parse"

      - name: The data model, the merge, and the served file
        run: |
          node _scraper/selftest.mjs
          node _scraper/import-sheet.mjs --selftest
          node _scraper/import-legacy-tables.mjs --selftest

      - name: No secret ever reaches a served file
        run: |
          set -e
          # The repository is public. data/ is fetched by every visitor, so a
          # submitter's e-mail address landing there would be a disclosure.
          if grep -rEl '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' data/ ; then
            echo "::error::an e-mail address is present in data/"
            exit 1
          fi
          # A pasted Firebase WEB config is fine — those are public by design and
          # appear in the page source of every Firebase site. A service-account
          # PRIVATE key is not.
          #
          # Match the full PEM delimiter INCLUDING its dashes. Grepping for the
          # bare words matched this repo's own documentation, which names the
          # string while explaining this very check — a guard that fails on
          # every push teaches people to ignore it, which is worse than not
          # having one.
          if grep -rlE --exclude-dir=node_modules --exclude-dir=.git -- '-----BEGIN [A-Z ]*PRIVATE KEY-----' . ; then
            echo "::error::private key material is committed in the served tree"
            exit 1
          fi
          echo "no e-mail addresses and no private key material in the served files"

      - name: The page renders its data
        run: |
          set -e
          npm install --no-save --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
          node _scraper/page-test.mjs
