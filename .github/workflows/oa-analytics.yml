# Rebuild data/analytics.json — the one file analytics.html plots.
#
# It is DELIBERATELY NOT part of oa-jobs-build.yml's BUILDERS list. That build
# fires on a schedule, a dispatch and a workflow_run — several times an hour —
# and it re-checks and commits data/ as one unit. The analytics read is a
# frequent snapshot job over the complete available record, and folding it in would make every
# posting's publish wait on it and share its failure. Its own workflow, its own
# concurrency group, its own commit.
#
# EVERY SOURCE IS INDEPENDENTLY GATED and an unreachable one changes nothing:
# the committed file stands, because a half-written one is a blank dashboard.
# So this is a clean no-op with no credentials at all, which is what lets it be
# committed and scheduled before anything is configured. See _SETUP-ANALYTICS.md
name: OA — analytics

on:
  schedule:
    # Refresh traffic every 15 minutes; GitHub may delay scheduled runs.
    - cron: '8,23,38,53 * * * *'
    - cron: '25 4 * * *'
  workflow_dispatch:
    inputs:
      merge_accounts:
        description: 'Plan a guarded provider merge; no analytics build'
        type: boolean
        default: false
      merge_write:
        description: 'Apply the specifically requested account merge'
        type: boolean
        default: false
      audit:
        description: 'Read-only audit of held candidate cards and requested referral URLs'
        type: boolean
        default: false
      keep_hash:
        description: 'Optional account hash for the read-only merge plan'
        type: string
        default: ''
      duplicate_hash:
        description: 'Optional duplicate account hash for the read-only merge plan'
        type: string
        default: ''
      dry_run:
        description: 'Build it and write nothing'
        type: boolean
        default: false
      scan:
        description: 'Report what each source would give, and stop'
        type: boolean
        default: false

concurrency:
  group: oa-analytics-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    if: ${{ !inputs.audit && !inputs.merge_accounts }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the branch tip, never github.sha — the trap this repository has now
          # hit twice: on a chained or queued run the default is a commit a
          # writer has already moved past, so the push is not a fast-forward
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install what the gated sources need
        # pinned like every other workflow here: firebase-admin 14 removed the
        # namespaced `admin.apps` this builder initialises with
        run: npm install --no-save --no-audit --no-fund firebase-admin@12 google-auth-library@9

      - run: node _scraper/analytics-coverage-test.mjs

      - name: Build
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GA4_SERVICE_ACCOUNT: ${{ secrets.GA4_SERVICE_ACCOUNT }}
          # The "Operations Academia - GA4" property. NOT a secret — it is an
          # internal id that appears in console URLs and is useless without the
          # service-account credential beside it — so it is committed rather
          # than made a setup step. A repository variable still overrides it.
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID || '384653143' }}
        run: |
          node _scraper/build-analytics.mjs \
            ${{ inputs.scan && '--scan' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      # Each candidate's PRIVATE view figures — how often their own profile
      # card was opened and its CV clicked — from the SAME usageSessions read,
      # written onto the candidate's own candidateSubmissions document and
      # nowhere under data/ (a served file is public). Same secret, same
      # cadence; a run with no credential is a clean no-op like the build
      # above. continue-on-error, deliberately: a failure here must never
      # hold the analytics figures back from their commit below.
      - name: Candidate statistics
        if: ${{ !inputs.scan && (github.event_name == 'workflow_dispatch' || startsWith(github.event.schedule, '25 4')) }}
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node _scraper/build-candidate-stats.mjs ${{ inputs.dry_run && '--dry-run' || '' }}

      # THIS JOB WRITES data/, so it runs the selftest in the publishing role
      # before it commits and again on anything it rebuilds — the rule every
      # other data writer here has kept since the day a red guard stopped the
      # site publishing. It was the one writer without it: the selftest
      # asserts over data/analytics.json (its shape, its paths, and that no
      # file under data/ carries an address), so a bad figure was committed
      # and turned the checks red on MASTER instead of failing this run.
      - name: Re-check what is about to be committed
        if: github.ref_name == 'master' && !inputs.dry_run && !inputs.scan
        run: node _scraper/selftest.mjs --publishing

      - name: Commit
        if: github.ref_name == 'master' && !inputs.dry_run && !inputs.scan
        run: |
          set -e
          if [ -z "$(git status --porcelain data/analytics.json data/analytics-meta.json)" ]; then
            echo "nothing changed."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/analytics.json data/analytics-meta.json
          git commit -m 'data: refresh the analytics figures'
          # data/ is a build OUTPUT, so a rejected push has nothing to
          # reconcile: take their tip and rebuild on top of it, never rebase
          # two independently generated copies of a file carrying a timestamp
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard FETCH_HEAD
            node _scraper/build-analytics.mjs
            if [ -z "$(git status --porcelain data/analytics.json data/analytics-meta.json)" ]; then
              echo "the other writer published it all."
              exit 0
            fi
            # the rebuilt dataset goes through the SAME gate the first pass
            # passed, or a retry commits exactly what the gate exists to refuse
            if ! node _scraper/selftest.mjs --publishing; then
              echo "::error::the rebuilt data/ does not pass the publishing gate - pushing nothing"
              exit 1
            fi
            git add data/analytics.json data/analytics-meta.json
            git commit -m 'data: refresh the analytics figures'
          done
          echo "::error::could not push after three rebuilds"
          exit 1
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GA4_SERVICE_ACCOUNT: ${{ secrets.GA4_SERVICE_ACCOUNT }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID || '384653143' }}

  audit:
    if: ${{ inputs.audit }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund firebase-admin@12 playwright@1 google-auth-library@9
      - run: npx playwright install --with-deps chromium
      - run: node _scraper/analytics-coverage-test.mjs
      - run: node _scraper/audit-analytics-page.mjs
      - run: node _scraper/audit-candidate-refresh.mjs
      - name: Read-only candidate layout audit
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node _scraper/audit-held-candidates.mjs
      - name: Requested referral links
        env:
          GA4_SERVICE_ACCOUNT: ${{ secrets.GA4_SERVICE_ACCOUNT }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID || '384653143' }}
        run: node _scraper/audit-referral-links.mjs
      - name: Read-only merge plan
        if: ${{ inputs.keep_hash != '' && inputs.duplicate_hash != '' }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          KEEP_HASH: ${{ inputs.keep_hash }}
          DUPLICATE_HASH: ${{ inputs.duplicate_hash }}
        run: node _scraper/inspect-account-merge.mjs

  merge:
    if: ${{ inputs.merge_accounts }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund firebase-admin@12
      - run: node _scraper/account-merge-test.mjs
      - name: Plan or apply the guarded account merge
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          KEEP_HASH: ${{ inputs.keep_hash }}
          DUPLICATE_HASH: ${{ inputs.duplicate_hash }}
          APPLY_MERGE: ${{ inputs.merge_write }}
        run: node _scraper/merge-account-identities.mjs
