name: OA — Profile Analytics checks
on:
  push:
    paths:
      - 'assets/oa-*analytics*'
      - 'assets/oa-usage.js'
      - 'assets/oa-listing-tracking.js'
      - 'assets/oa-feature-badges.js'
      - '*analytics.html'
      - '_firestore.rules'
      - '_scraper/*profile-analytics*'
      - '_scraper/listing-tracking-browser-test.mjs'
      - '_scraper/listing-detail-layout-test.mjs'
      - '_functions/test/profile-analytics-rules.mjs'
      - '.github/workflows/oa-profile-analytics-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: node _scraper/profile-analytics-test.mjs
      - run: npm install --no-save --no-audit --no-fund playwright@1 firebase-tools@14
      - run: npm ci --prefix _functions
      - run: npx playwright install --with-deps chromium
      - run: node _scraper/profile-analytics-browser-test.mjs
      - run: node _scraper/listing-tracking-browser-test.mjs
      - run: node _scraper/listing-detail-layout-test.mjs
      - run: npx firebase emulators:exec --project demo-oa-analytics --only firestore "node _functions/test/profile-analytics-rules.mjs"
